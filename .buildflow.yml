# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow
# nix-build builds the full `.#checks` tree for EVERY system the flake
# advertises (github:nix-systems/default = darwin + linux), so on any single
# machine the other platform's checks always fail with a platform mismatch.
# Coverage is preserved: nix-flake-check still evaluates everything and the
# linux format check is enforced in CI; real builds go through the flake apps.
# (eslint-fix skip removed: BuildFlow now auto-defers eslint when the repo
# has no eslint config, which is by design here.)
skip_steps:
  - nix-build
