# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow
# (eslint-fix skip removed: BuildFlow now auto-defers eslint when the repo
# has no eslint config, which is by design here.)
# pnpm-audit skipped: this repo root has no JavaScript — no pnpm-lock.yaml
# exists to audit (website/ is a separate pnpm project BuildFlow does not
# traverse from here). The tool hard-fails on the missing lockfile, which
# blocked every manual pre-commit run (2026-09-13).
# license-check REQUIRES the machine-local ~/.local/bin/go-licenses wrapper
# (re-exports the active `go env GOROOT` before exec): go-licenses v1.6.0
# classifies stdlib by the GOROOT baked into its binary, so under
# GOTOOLCHAIN=auto every stdlib package is misread as "no module info" and
# the step fails on all 10 modules (2026-10-06). If BuildFlow reinstalls the
# raw binary over the wrapper, this gate dies again — restore the wrapper or
# land the upstream fix (TODO_LIST #352).
# nix-build (re-verified 2026-10-07): the multi-system platform mismatch is
# FIXED (BuildFlow now filters to x86_64-linux only), but
# checks.x86_64-linux.{format,treefmt} still fail structurally: the treefmt
# golines/templ formatters resolve go via GOTOOLCHAIN=auto and try to download
# go1.27.0 inside the network-free build sandbox (connection refused on
# proxy.golang.org). Fix = pin the formatter go wrappers to the flake's goPkg
# the way cqrs-htmx/flake.nix does, then remove this skip.
skip_steps:
  - nix-build
  - pnpm-audit
  # go-version-auto-configure skipped: same skew class as go-structure-linter
  # above — the step normalizes go directives to the bare minor ("1.26") while
  # `go mod tidy` canonicalizes visualtest's directive to "1.26.0", so the
  # step's own repair re-creates the go.work toolchain skew ("requires go >=
  # 1.26.0, but go.work lists go 1.26") and fails every workspace-mode lane
  # (go-generate, golangci-lint, license-check) later in the SAME pipeline
  # run. The coherent state is 1.26.0 everywhere (root + website + visualtest
  # + go.work); utils.TestGoWorkDirectiveMatchesRootGoMod and
  # utils.TestGoDirectiveSkew are the real enforcement. Re-enable only with a
  # lockstep toolchain bump or an upstream fix that respects patch-suffixed
  # directives.
  - go-version-auto-configure
  # go-auto-upgrade skipped: it "upgrades" dependencies to the newest proxy
  # version without consulting repo-level pin decisions — it re-applied the
  # templ v0.3.1070 go.mod bump THREE times (2026-10-05 twice, 2026-10-06
  # again as daemon commit befc13ba) after the rollback documented in
  # docs/agent-context-history.md. The bump is deliberately deferred until
  # the TODO_LIST #335 migration (flake generator pin + golden re-baseline);
  # utils.TestTemplVersionPin is the enforcement. Re-enable only after #335
  # lands (or when the step learns to respect pinned rejects).
  - go-auto-upgrade
