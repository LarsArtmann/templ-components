version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ is PINNED in lockstep with the dev-shell generator (go.mod
    # v0.3.1020 == nixpkgs templ; any bump needs the ONE golden/visual
    # re-baseline event, TODO #335 — a bot bump re-creates the daemon's
    # poisoned v0.3.1070 train; utils.TestTemplVersionPin fails it).
    # go-error-family moves ONLY via docs/external-dependency-bumps.md's
    # verify-at-source protocol — per-directory bot bumps are exactly how
    # the 2026-11-01 errorpage-vs-consumers version skew was born
    # (utils.TestGoErrorFamilyPinAlignment fails any skew).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /charts/echarts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /datastar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /errorpage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    # errorpage is go-error-family's DIRECT consumer — a bot bump here is
    # precisely the skew class the pin-train guard exists for.
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /htmx
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /icons
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /utils
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /visualtest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # templ + go-error-family are bot-ignored repo-wide: see the `/` block
    # rationale above (generator lockstep + verify-at-source bump protocol).
    ignore:
      - dependency-name: github.com/a-h/templ
      - dependency-name: github.com/larsartmann/go-error-family
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /tools/crossbrowser-spike
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # playwright-core is ANCHORED to the locked nixpkgs playwright-driver
    # version (browser revisions are hardcoded per release) — the
    # utils.TestCrossbrowserLockstep guard enforces the equality. Dependabot
    # bumped it to 1.64.1 twice (6477d6d3 re-broke master after the
    # 1aa8c212 restore; nixpkgs is still 1.63.0), so it is ignored here:
    # bumps happen via the one-commit lockstep rule (guard constant +
    # package.json + package-lock + flake check) when nixpkgs moves first.
    ignore:
      - dependency-name: playwright-core
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
