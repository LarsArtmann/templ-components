name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint-config guard (fast, fails before golangci-lint runs)
        run: scripts/check-lint-config.sh

      - name: Templ-sync guard (fast, catches *_templ.go drift before generate)
        run: scripts/check-templ-sync.sh

      - name: Run golangci-lint
        run: |
          golangci-lint run --timeout=5m \
            ./display/... ./errorpage/... ./feedback/... ./forms/... \
            ./htmx/... ./icons/... ./integration/... ./internal/... \
            ./layout/... ./navigation/... ./recipes/... ./utils/...

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ files
        run: templ generate

      - name: Verify all *_templ.go files are tracked
        run: |
          EXIT_CODE=0
          for templ_file in $(find . -name '*.templ' -not -path './vendor/*' -not -path './cmd/tc/_sources/*'); do
            gen_file="${templ_file%.templ}_templ.go"
            if ! git ls-files --error-unmatch "$gen_file" >/dev/null 2>&1; then
              echo "::error::$gen_file is not tracked. Generated files MUST be committed."
              echo "::error::Check .gitignore for conflicting *_templ.go rules."
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

      - name: Go mod tidy
        run: go mod tidy

      - name: Verify no untracked changes
        run: git diff --exit-code

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v examples)

      - name: Compile visualtest module (separate go.mod, would otherwise be skipped)
        run: cd visualtest && GOWORK=off GOEXPERIMENT=jsonv2 go test -count=1 ./...
        # Tests skip cleanly when Chromium is absent, so this never red-lines CI
        # purely over a missing browser. The check catches compile-only regressions
        # like the visualtest/doc.go `:=` shadowing bug (2026-07-28).

      - name: Docs-health drift guard
        run: go test ./utils/... -run TestDocsCountDrift

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

      - name: Build examples
        run: go build ./examples/...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.out

  # CSS freshness check: recompile demo CSS via Nix-provided Tailwind and diff
  # against the committed file. Catches stale CSS that shipped in v1.7.0
  # (missing bg-amber-50 class). Runs in the Nix lane so the Tailwind binary
  # matches the one used locally via `nix run .#css`.
  css:
    name: CSS Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Recompile demo CSS and diff against committed
        run: |
          cp examples/demo/static/app.css /tmp/committed-app.css
          nix run .#css
          if ! diff -q /tmp/committed-app.css examples/demo/static/app.css; then
            echo "::error::Committed CSS is stale. Recompile with: nix run .#css"
            diff /tmp/committed-app.css examples/demo/static/app.css | head -30
            exit 1
          fi
          echo "CSS is fresh."

  # Visual regression tests run via Nix so the Chromium binary matches the one
  # used to generate the committed golden PNGs (same nixpkgs revision → bit-
  # identical renderer). A non-Nix Chromium would produce font/anti-aliasing
  # drift and false-fail the pixel comparison. See docs/visual-testing.md.
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run visual tests
        run: nix run .#visual
      - name: Upload failure artifacts (actual + diff PNGs)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-failures
          path: visualtest/testdata/.fail/
          if-no-files-found: ignore
