name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  # Mechanical enforcement of the always-warm [Unreleased] rule: a PR that
  # touches library component code must also diff CHANGELOG.md (2026-08-31:
  # PR #5 shipped component changes with an empty [Unreleased]). Uses the PR
  # files API, so no git history fetch is needed.
  changelog-guard:
    name: CHANGELOG warmth (component PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a CHANGELOG.md diff when library code changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          echo "Changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -Eq '\.templ$|^(display|feedback|forms|layout|navigation|htmx|datastar|errorpage|icons|utils|charts)/.*\.go$'; then
            if ! echo "$FILES" | grep -q '^CHANGELOG.md$'; then
              echo "::error::This PR changes library components but does not touch CHANGELOG.md."
              echo "::error::House rule: every feature/fix change warms [Unreleased] in the same change."
              exit 1
            fi
            echo "CHANGELOG.md is part of the diff — guard satisfied."
          else
            echo "No library component code changed; CHANGELOG not required."
          fi

  release-tags:
    name: Release tag completeness
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls every tag: the sub-module tags live on the same
      # release commit as the pushed root tag and must all be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify every sub-module carries the release tag
        run: scripts/check-release-tags.sh "${GITHUB_REF_NAME#v}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        # Pinned (was @latest): a floating install made lint results
        # non-reproducible — the exhaustruct deprecation drifted in via
        # @latest. Bump deliberately, after checking the changelog.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint-config guard (fast, fails before golangci-lint runs)
        run: scripts/check-lint-config.sh

      - name: Templ-sync guard (fast, catches *_templ.go drift before generate)
        run: scripts/check-templ-sync.sh

      - name: Version-sync guard (fast, catches version drift before test)
        run: scripts/check-version-sync.sh

      - name: Module-sync guard (fast, catches multi-module workspace drift)
        run: scripts/check-module-sync.sh

      - name: Module DAG layer guard (fast, catches upward dependencies)
        run: scripts/check-module-layers.sh

      - name: Run golangci-lint
        run: |
          # Multi-module: lint each module independently (golangci-lint
          # does not support go.work workspace mode).
          echo "==> Root module..."
          golangci-lint run --timeout=5m \
            ./display/... ./feedback/... ./forms/... \
            ./integration/... ./internal/... \
            ./layout/... ./navigation/... ./recipes/... ./cmd/...
          echo "==> utils module..."
          (cd utils && golangci-lint run --timeout=5m ./...)
          echo "==> icons module..."
          (cd icons && golangci-lint run --timeout=5m ./...)
          echo "==> errorpage module..."
          (cd errorpage && golangci-lint run --timeout=5m ./...)
          echo "==> charts/echarts module..."
          (cd charts/echarts && golangci-lint run --timeout=5m ./...)
          echo "==> datastar module..."
          (cd datastar && golangci-lint run --timeout=5m ./...)
          echo "==> htmx module..."
          (cd htmx && golangci-lint run --timeout=5m ./...)

      - name: Actionlint (lint GitHub Actions workflows)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ files
        run: templ generate

      - name: Verify all *_templ.go files are tracked
        run: |
          EXIT_CODE=0
          while IFS= read -r -d '' templ_file; do
            gen_file="${templ_file%.templ}_templ.go"
            if ! git ls-files --error-unmatch "$gen_file" >/dev/null 2>&1; then
              echo "::error::$gen_file is not tracked. Generated files MUST be committed."
              echo "::error::Check .gitignore for conflicting *_templ.go rules."
              EXIT_CODE=1
            fi
          done < <(find . -name '*.templ' -not -path './vendor/*' -not -path './cmd/tc/_sources/*' -print0)
          exit $EXIT_CODE

      - name: Go mod tidy (all modules)
        run: |
          go mod tidy
          # visualtest included: its go.sum drift (the v1.11.0 class) used to
          # surface only in the separate Visual Regression job. Tidying it here
          # lets the "Verify no untracked changes" step below fail fast. Works
          # offline: visualtest/go.mod carries local replace directives.
          for mod in utils icons errorpage charts/echarts datastar htmx visualtest; do
            (cd "$mod" && GOWORK=off go mod tidy)
          done

      - name: Verify no untracked changes
        run: git diff --exit-code

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go list ./... | grep -v examples | xargs go test -race -coverprofile=coverage.out

      - name: Per-module isolation tests (GOWORK=off, race-enabled)
        run: |
          for mod in utils icons errorpage charts/echarts datastar htmx; do
            echo "==> $mod"
            (cd "$mod" && GOWORK=off go test -race -count=1 ./...)
          done

      - name: Compile visualtest module (separate go.mod, would otherwise be skipped)
        run: |
          cd visualtest
          # Retry: proxy.golang.org INTERNAL_ERROR flaked one run (33399151599);
          # a rerun passed. Compile checks are cheap, so retry twice before
          # failing the pipeline.
          for attempt in 1 2 3; do
            if GOWORK=off GOEXPERIMENT=jsonv2 go test -count=1 ./...; then
              exit 0
            fi
            echo "::warning::visualtest compile attempt ${attempt}/3 failed — retrying after backoff"
            sleep $((attempt * 5))
          done
          echo "::error::visualtest compile failed after 3 attempts (not a proxy flake — inspect the logs)."
          exit 1
        # Compile-only check: this step has no Chromium, so tests skip.
        # Actual visual regression runs in the dedicated "Visual Regression"
        # job below (hard gate — fails the pipeline if any test skips or fails).

      - name: Vulnerability gate (govulncheck, root + all modules)
        run: |
          # Reachable-vuln findings fail the build: govulncheck only reports
          # symbols this code actually calls, so every finding is actionable.
          # Pinned v1.7.0 (the golangci-lint lesson: never @latest a scanner —
          # upstream releases must not change CI behavior overnight). The same
          # version ships in nixpkgs for local parity via ci-repro.sh --vuln.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "==> Root module..."
          govulncheck ./...
          for mod in utils icons errorpage charts/echarts datastar htmx visualtest; do
            echo "==> $mod..."
            (cd "$mod" && GOWORK=off govulncheck ./...)
          done

      - name: Docs-health drift guard
        run: cd utils && go test ./... -run TestDocsCountDrift

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

      - name: Build examples
        run: go build ./examples/...

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out

  # CSS freshness check: recompile demo CSS via Nix-provided Tailwind and diff
  # against the committed file. Catches stale CSS that shipped in v1.7.0
  # (missing bg-amber-50 class). Runs in the Nix lane so the Tailwind binary
  # matches the one used locally via `nix run .#css`.
  css:
    name: CSS Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Recompile demo CSS and diff against committed
        run: |
          cp examples/demo/static/app.css /tmp/committed-app.css
          nix run .#css
          if ! diff -q /tmp/committed-app.css examples/demo/static/app.css; then
            echo "::error::Committed CSS is stale. Recompile with: nix run .#css"
            diff /tmp/committed-app.css examples/demo/static/app.css | head -30
            exit 1
          fi
          echo "CSS is fresh."

  # Visual regression tests — HARD GATE. Runs via Nix so the Chromium binary
  # matches the one used to generate the committed golden PNGs (same nixpkgs
  # revision → bit-identical renderer). A non-Nix Chromium would produce
  # font/anti-aliasing drift and false-fail the pixel comparison. If ANY test
  # skips (e.g. Chromium missing) or fails, the pipeline goes red.
  # See docs/visual-testing.md.
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run visual tests (fail if any test skips or fails)
        run: |
          # Capture without letting `set -e` abort before the output is echoed:
          # a failing `nix run` must still print the test log for debugging.
          set +e
          OUTPUT=$(nix run .#visual 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Visual tests failed with exit code $STATUS — see log above"
            exit 1
          fi
          if echo "$OUTPUT" | grep -qiE '(SKIP|no Chromium binary found)'; then
            echo "::error::Visual tests were skipped — Chromium must be available in CI"
            exit 1
          fi
      - name: Upload failure artifacts (actual + diff PNGs)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-failures
          path: visualtest/testdata/.fail/
          if-no-files-found: ignore
          # .fail starts with a dot — v4's default excludes hidden files,
          # which silently produced an empty artifact.
          include-hidden-files: true
