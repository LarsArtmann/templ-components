# Cross-engine screenshot diagnostics (M13, plan 2026-10-15) — ⫱G1-GATED LANE
# DRAFT: workflow_dispatch ONLY — this lane never runs on push/PR and gates
# nothing until the owner ratifies ⫱G1 (see docs/adr/0048 and the M24 budget
# table for owner + kill-criteria). Guardrail 1: findings lane, never a second
# pixel suite. Action pins verified against upstream tags 2026-10-15
# (checkout v7.0.1, nix-installer-action v23, upload-artifact v7.0.2).
name: crossbrowser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: 3-engine demo screenshots (Chromium + Firefox + WebKit)
        run: nix run .#crossbrowser

      - name: Upload per-route captures + error reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crossbrowser-captures
          path: tools/crossbrowser-spike/artifacts/
          retention-days: 14
