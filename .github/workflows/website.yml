name: Website

on:
  push:
    branches: [master]
    paths:
      - website/**
      - examples/demo/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master]
    paths:
      - website/**
      - examples/demo/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Enable corepack BEFORE setup-node: its `cache: pnpm` probe runs
      # `pnpm store path` and fails if pnpm is not on PATH yet. The website
      # declares "packageManager": "pnpm@11.20.0" in package.json, so
      # corepack activates exactly that pinned version (Node 24 ships corepack).
      - run: corepack enable pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm --version

      - run: pnpm install

      - name: pnpm audit
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true

      - run: pnpm dlx astro check
        continue-on-error: true

      - run: pnpm run build

      - name: HTML Validation
        run: pnpm dlx html-validate --config .htmlvalidate.json "dist/**/*.html"
        continue-on-error: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          path: website/dist/

  deploy-website:
    name: Deploy Website + Demo
    needs: build-website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: website/dist/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEMPLCOMPONENTS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push demo image
        run: |
          docker build -t us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest \
            -f examples/demo/Dockerfile .
          docker push us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest

      - name: Deploy demo to Cloud Run
        run: |
          gcloud run deploy templcomponents-demo \
            --image=us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest \
            --region=us-central1 \
            --project=lars-software \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --memory=256Mi \
            --cpu=1 \
            --timeout=60 \
            --ingress=all \
            --allow-unauthenticated

      - name: Deploy to Firebase Hosting
        working-directory: website
        # npm, not pnpm: `pnpm add -g` fails its preflight because the
        # pnpm global bin dir (~/.local/share/pnpm/bin) is not on PATH on
        # GitHub runners, and corepack does not set PNPM_HOME. Verified by
        # container replication on node:24 with corepack pnpm@11.20.0.
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:templcomponents --project lars-software
