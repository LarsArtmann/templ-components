name: Website

on:
  push:
    branches: [master]
    paths:
      - website/**
      - examples/demo/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master]
    paths:
      - website/**
      - examples/demo/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # errorpage (404 page) uses encoding/json/v2 until Go 1.27 makes it stable.
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Compile check (templ output is committed, no generate step needed)
        run: GOWORK=off go build ./...

      - name: Lint website module
        # Pinned (was @latest): a floating install made lint results drift
        # between runs (see ci.yaml "Install golangci-lint").
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run golangci-lint
        run: GOWORK=off golangci-lint run ./...

      - name: Build site (Go SSG + Tailwind CSS v4)
        # npm -g, not pnpm: pnpm's global bin preflight fails on runners
        # (see the deploy job note below).
        # BOTH packages: @tailwindcss/cli declares `tailwindcss` as a peer
        # dependency, and npm does NOT install peers of globally-installed
        # packages — the CLI alone dies with "Can't resolve 'tailwindcss'"
        # (red since the 2026-09-13 SSG rewrite; the demo Dockerfile installs
        # the same pair for the same reason).
        run: |
          npm install -g @tailwindcss/cli tailwindcss
          bash build.sh

      - name: HTML Validation
        run: |
          npm install -g html-validate
          html-validate --config .htmlvalidate.json "dist/**/*.html"
        continue-on-error: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          path: website/dist/

  deploy-website:
    name: Deploy Website + Demo
    needs: build-website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: website/dist/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEMPLCOMPONENTS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push demo image
        run: |
          docker build -t us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest \
            -f examples/demo/Dockerfile .
          docker push us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest

      - name: Deploy demo to Cloud Run
        run: |
          gcloud run deploy templcomponents-demo \
            --image=us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest \
            --region=us-central1 \
            --project=lars-software \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --memory=256Mi \
            --cpu=1 \
            --timeout=60 \
            --ingress=all \
            --allow-unauthenticated

      - name: Deploy to Firebase Hosting
        working-directory: website
        # npm, not pnpm: `pnpm add -g` fails its preflight because the
        # pnpm global bin dir is not on PATH on GitHub runners, and
        # corepack does not set PNPM_HOME.
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:templcomponents --project lars-software
