name: Website

on:
  push:
    branches: [master]
    paths:
      - website/**
      - examples/demo/**
      - .github/workflows/website.yml
  pull_request:
    branches: [master]
    paths:
      - website/**
      - examples/demo/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # errorpage (404 page) uses encoding/json/v2 until Go 1.27 makes it stable.
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Compile check (templ output is committed, no generate step needed)
        run: GOWORK=off go build ./...

      - name: Test website module
        # Parity with the library's Build job (#241): the module ships tests
        # (CSP hash sync, link checker, page goldens, site integrity) — a
        # compile-only workflow let every one of them rot invisibly.
        run: GOWORK=off go test ./... -count=1

      - name: Lint website module
        # Pinned (was @latest): a floating install made lint results drift
        # between runs (see ci.yaml "Install golangci-lint").
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run golangci-lint
        run: GOWORK=off golangci-lint run ./...

      - name: Build site (Go SSG + Tailwind CSS v4)
        # LOCAL install (not npm -g), mirroring the demo Dockerfile: Tailwind
        # v4 resolves the CSS `@import "tailwindcss"` (and the CLI's own peer
        # import) against node_modules discoverable from the CWD — a global
        # install is NOT on that resolution path ("Can't resolve 'tailwindcss'",
        # red since the 2026-09-13 SSG rewrite), and npm does not install
        # peers of globally-installed packages either. Both packages go in
        # together: @tailwindcss/cli declares `tailwindcss` as a peer.
        run: |
          npm install --no-save tailwindcss @tailwindcss/cli
          # SITE_LIVE_STARS=1: the artifact from THIS build is what deploys
          # (deploy-website downloads website-dist), so production keeps the
          # live star count; every other consumer of build.sh now defaults to
          # the deterministic fallback badge (backlog #271).
          SITE_LIVE_STARS=1 PATH="$PWD/node_modules/.bin:$PATH" bash build.sh

      - name: HTML Validation (blocking)
        # Now BLOCKING (#241): the step ran with continue-on-error for its
        # whole life while 6 real finding classes piled up invisibly
        # (double <main> on 404, unlabeled landmark twins, duplicated
        # classes) — all fixed 2026-09-17. Two rules stay off, by design:
        #   - doctype-style: templ's generator lowercases the doctype no
        #     matter what the source says; HTML5 is case-insensitive.
        #   - prefer-native-element: the docs search combobox is a custom
        #     listbox widget on purpose (no native element provides
        #     filtered, anchored results).
        run: |
          npm install -g html-validate
          html-validate --config .htmlvalidate.json "dist/**/*.html"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          path: website/dist/

  deploy-website:
    name: Deploy Website + Demo
    needs: build-website
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: website/dist/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEMPLCOMPONENTS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push demo image
        run: |
          docker build -t us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest \
            -f examples/demo/Dockerfile .
          docker push us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest

      - name: Deploy demo to Cloud Run
        run: |
          gcloud run deploy templcomponents-demo \
            --image=us-central1-docker.pkg.dev/lars-software/templcomponents/demo:latest \
            --region=us-central1 \
            --project=lars-software \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --memory=256Mi \
            --cpu=1 \
            --timeout=60 \
            --ingress=all \
            --allow-unauthenticated

      - name: Deploy to Firebase Hosting
        working-directory: website
        # npm, not pnpm: `pnpm add -g` fails its preflight because the
        # pnpm global bin dir is not on PATH on GitHub runners, and
        # corepack does not set PNPM_HOME.
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:templcomponents --project lars-software

      - name: Post-deploy smoke (site 200 + demo /health)
        # A deploy job that proves nothing ships broken sites silently; this
        # fails the workflow when either surface is down right after deploy.
        run: |
          demo_url="$(gcloud run services describe templcomponents-demo \
            --region=us-central1 --project=lars-software \
            --format='value(status.url)')"
          echo "Site: ${SiteURL}/ · Demo: ${demo_url}"
          curl -fsS -o /dev/null -w "site: %{http_code}\n" "${SiteURL}/"
          health="$(curl -fsS "${demo_url}/health")"
          echo "demo /health: ${health}"
          echo "${health}" | grep -q '"status":"ok"'
        env:
          SiteURL: https://templcomponents.lars.software
